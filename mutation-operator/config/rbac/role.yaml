---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mutations.kratos.dev
  resources:
  - assigns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mutations.kratos.dev
  resources:
  - assigns/finalizers
  verbs:
  - update
- apiGroups:
  - mutations.kratos.dev
  resources:
  - assigns/status
  verbs:
  - get
  - patch
  - update
