# permissions for end users to edit assigns.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kratos-operator
    app.kubernetes.io/managed-by: kustomize
  name: assign-editor-role
rules:
- apiGroups:
  - mutations.kratos.dev
  resources:
  - assigns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mutations.kratos.dev
  resources:
  - assigns/status
  verbs:
  - get
